name: SUMMIT core tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Install SUMMIT and test dependencies
        env:
          CMAKE_ARGS: -DBLA_VENDOR=OpenBLAS
        run: python -m pip install -e . pytest
      - name: Run unit and numerical-oracle tests
        run: python -m pytest -q
