name: SUMMIT core tests

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        numpy: ["numpy=1.26.*", "numpy=2.3.*"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Check repository content
        run: python scripts/check_repository_content.py
      - name: Prepare the selected NumPy environment
        env:
          NUMPY_SPEC: ${{ matrix.numpy }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("environment.yml").read_text()
          source = source.replace("  - numpy>=1.25\n", f"  - {os.environ['NUMPY_SPEC']}\n")
          Path(os.environ["RUNNER_TEMP"], "summit-environment.yml").write_text(source)
          PY
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5
        with:
          activate-environment: summit
          environment-file: ${{ runner.temp }}/summit-environment.yml
          auto-activate-base: false
      - name: Build SUMMIT against the environment OpenBLAS
        env:
          CMAKE_ARGS: -DBLA_VENDOR=OpenBLAS
        run: python -m pip install -e . --no-deps
      - name: Verify one process-wide BLAS runtime
        run: |
          python - <<'PY'
          from threadpoolctl import threadpool_info
          import numpy as np

          np.ones((2, 2)) @ np.ones((2, 2))
          runtimes = [
              item for item in threadpool_info()
              if item.get("user_api") == "blas"
          ]
          if len(runtimes) != 1:
              raise RuntimeError(f"Expected one BLAS runtime, observed: {runtimes}")
          print(runtimes[0])
          PY
      - name: Run unit and numerical-oracle tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -X faulthandler -m pytest -q

  macos-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5
        with:
          activate-environment: summit
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install AppleClang OpenMP runtime
        run: conda install -y -c conda-forge llvm-openmp
      - name: Build all native modules against OpenBLAS
        env:
          CMAKE_ARGS: -DBLA_VENDOR=OpenBLAS
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: python -m pip install -e . --no-deps
      - name: Run native GxE, generalized, and prediction numerical tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: >-
          python -X faulthandler -m pytest -q
          tests/test_pinned_genotype.py
          tests/test_gxe_native_core.py
          tests/test_gxe_multi_environment.py
          tests/test_generalized_gxe_native.py
          tests/test_generalized_gxe_composition.py
          tests/test_prediction_core.py
          tests/test_prediction_io.py
          tests/test_prediction_packed.py
          tests/test_prediction_annotations.py
          tests/test_prediction_mixture.py
          tests/test_memory_budget.py
          tests/test_pcgc*.py
      - name: Run synthetic GxE examples
        run: |
          example_dir=$(mktemp -d)
          cp example/prepare_example_inputs.py example/estimate_gxe_ldscore.sh "$example_dir/"
          bash "$example_dir/estimate_gxe_ldscore.sh"
          summit --geno "$example_dir/out/synthetic/small.bed" \
            --env "$example_dir/out/synthetic/small.env" \
            --annot "$example_dir/out/synthetic/small.annot" \
            --covar "$example_dir/out/synthetic/small.cov" \
            --out "$example_dir/out/native" --nvecs 100 --block-size 256 \
            --seed 1 --dtype float64 --num-threads 2 \
            --gxe-native-backend direct --rand-dist rademacher
          python example/estimate_generalized_gxe_variant_ldscore.py \
            --prefix "$example_dir/out/synthetic/small" \
            --output "$example_dir/out/generalized" --probes 16 --njack 20 --threads 2
