name: summit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.25
  - pandas>=2.0
  - scipy>=1.11
  - tqdm>=4.64
  - bed-reader>=1.0
  - psutil
  - threadpoolctl>=3.2
  - pip

  # build toolchain
  - cmake>=3.26
  - ninja
  - pybind11>=2.12
  - scikit-build-core>=0.5
  - pkg-config

  # BLAS/LAPACK -> force OpenBLAS provider and install headers too
  - openblas>=0.3
  - libblas=*=*openblas
  - liblapack=*=*openblas