name: summit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.25
  - pandas>=2.0
  - scipy>=1.11
  - tqdm>=4.64
  - bed-reader>=1.0
  - psutil
  - pytest>=7
  - threadpoolctl>=3.2
  - pip
  - pip:
      - pgenlib==0.94.1

  # build toolchain
  - cmake>=3.26
  - ninja
  - nanobind>=2.2
  - scikit-build-core>=0.5
  - pkg-config

  # BLAS/LAPACK -> force OpenBLAS provider and install headers too
  # 0.3.31 reverted a 0.3.30 parallel-GEMM partitioning race. SUMMIT also
  # verifies large GxE products at runtime, but do not provision the known
  # vulnerable release in new environments.
  - openblas>=0.3.31
  - libblas=*=*openblas
  - liblapack=*=*openblas
