[build-system]
requires = [
  "scikit-build-core>=0.5",
  "nanobind>=2.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "gwldcore"
version = "0.1.0"
requires-python = ">=3.9"
description = "Nanobind-backed genome-wide and windowed LD score native extensions"

[project.scripts]
summit = "summit.cli:main"

[tool.scikit-build]
minimum-version = "0.5"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
